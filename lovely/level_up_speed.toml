[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = '[SMODS _ src/utils.lua]'
pattern = '''
update_hand_text({sound = 'button', volume = 0.7, pitch = 0.8, delay = 0.3}, {handname=localize(hand, 'poker_hands'), level=G.GAME.hands[hand].level})
'''
position = 'at'
payload = '''
update_hand_text({sound = 'button', volume = 0.7, pitch = 0.8, delay = args.speed and 0.3 / args.speed or 0.3}, {handname=localize(hand, 'poker_hands'), level=G.GAME.hands[hand].level})
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '[SMODS _ src/utils.lua]'
pattern = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = i == 1 and 0.2 or 0.9, func = function()
'''
position = 'at'
payload = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = i == 1 and (args.speed and 0.2 / args.speed or 0.2) or (args.speed and 0.9 / args.speed or 0.9), func = function()
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '[SMODS _ src/utils.lua]'
pattern = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = 0.9, func = function()
'''
position = 'at'
payload = '''
G.E_MANAGER:add_event(Event({trigger = 'after', delay = args.speed and 0.9 / args.speed or 0.9, func = function()
'''
match_indent = true

[[patches]]
[patches.pattern]
target = '[SMODS _ src/utils.lua]'
pattern = '''
if not instant then delay(1.3) end
'''
position = 'at'
payload = '''
if not instant then delay(args.speed and 1.3 / args.speed or 1.3) end
'''
match_indent = true