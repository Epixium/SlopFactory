pattern = '''
if obj and obj.remove_from_deck and type(obj.remove_from_deck) == 'function' then
    obj:remove_from_deck(self, from_debuff)
'''
position = 'after'
payload = '''
end
local edition = G.P_CENTERS[self.edition and self.edition.key]
if edition and edition.remove_from_deck and type(edition.remove_from_deck) == 'function' then
    edition:remove_from_deck(self, from_debuff)
'''
match_indent = true